<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSU34011 Symbolic Programming</title>

<!-- Start the two main font files now, not after the stylesheets and page are built. -->
<link rel="preload" href="../shared/vendor/fonts/atkinson/AtkinsonHyperlegible-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../shared/vendor/fonts/atkinson/AtkinsonHyperlegible-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../shared/hero.css">
<link rel="stylesheet" href="../shared/bold.css">
<link rel="stylesheet" href="../shared/circle.css">
<link rel="stylesheet" href="../shared/vsearch.css">
<link rel="stylesheet" href="../shared/checklist.css">
<link rel="stylesheet" href="../shared/theme-ink.css">
<link rel="stylesheet" href="../shared/options.css">
</head>
<body>
<div id="app"></div>

<script src="../shared/theme-ink.js"></script>
<script>
  // Look options from the address (the preview's form): corners=sharp, colour=blue, cards=smaller|shorter,
  // font=<a key of FONTS>.
  // Set before the page is built, since the header takes its colours from THEME.
  (() => {
    const look = new URLSearchParams(location.search);
    const on = (name) => document.body.classList.add(`o-${name}`);
    if (look.get('corners') === 'sharp') on('sharp');
    if (['smaller', 'shorter'].includes(look.get('cards'))) on(look.get('cards'));
    if (look.get('colour') === 'blue') {
      on('blue');
      THEME.header = { bg: '#142D45', fg: '#1D3F60', opacity: 1 };
    }
    // Fonts from different design traditions, self-hosted under vendor/fonts; only the chosen one loads.
    const FONTS = {
      heros: ['heros', "'Heros TT', Helvetica, Arial, sans-serif"],
      aileron: ['aileron', "'Aileron', Univers, Arial, sans-serif"],
      jost: ['jost', "'Jost', Futura, 'Century Gothic', sans-serif"],
      cabin: ['cabin', "'Cabin', 'Gill Sans', sans-serif"],
      oswald: ['oswald', "'Oswald', 'Arial Narrow', sans-serif"],
      plex: ['plex', "'IBM Plex Sans', Arial, sans-serif"],
      etbook: ['et-book', "'ET Book', Palatino, Georgia, serif"],
      sourceserif: ['source-serif', "'Source Serif 4', Georgia, serif"],
    };
    const font = FONTS[look.get('font')];
    if (font) {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `../shared/vendor/fonts/${font[0]}/${font[0]}.css`;
      document.head.append(css);
      document.body.style.setProperty('--font', font[1]);
    }
  })();
</script>
<script src="../shared/data.js"></script>
<script src="../shared/pdfindex.js"></script>
<script src="../shared/proto.js"></script>
<script src="../shared/hero-patterns.js"></script>
<script src="../shared/hero.js"></script>
<script src="../shared/circle.js"></script>
<script src="../shared/vsearch.js"></script>
<script src="../shared/checklist.js"></script>
<script>
  // The version to show comes from the address: ?view=unified|split|list&search=on&checklist=on
  // (what the preview's form sends). With no choices given, everything is on in one list.
  const choice = new URLSearchParams(location.search);
  const chosen = choice.has('view');
  const beyond = { split: 'cards', list: 'list' }[choice.get('view')] || 'merged';
  if (!chosen || choice.has('search')) {
    VSEARCH.mount('final', { beyond });
  } else {
    P.bar('final');
    document.getElementById('app').innerHTML = CIRCLE.page({ beyond });
  }
  if (!chosen || choice.has('checklist')) CHECKLIST.mount();
</script>
<div aria-hidden="true" style="position:fixed;left:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:999px;background:rgba(20,20,20,.72);color:#fff;font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.04em">Preview</div>
</body>
</html>
