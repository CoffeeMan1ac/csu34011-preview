<script>
  // The version to show comes from the address: ?view=unified|split&search=on&checklist=on
  // (what the preview's form sends). With no choices given, everything is on in one list.
  const choice = new URLSearchParams(location.search);
  const chosen = choice.has('view');
  const beyond = choice.get('view') === 'split' ? 'cards' : 'merged';
  if (!chosen || choice.has('search')) {
    VSEARCH.mount('final', { beyond });
  } else {
    P.bar('final');
    document.getElementById('app').innerHTML = CIRCLE.page({ beyond });
  }
  if (!chosen || choice.has('checklist')) CHECKLIST.mount();
</script>
<div aria-hidden="true" style="position:fixed;left:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:999px;background:rgba(20,20,20,.72);color:#fff;font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.04em">Preview</div>
