<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSU34011 site · preview</title>
<style>
  body { margin: 0; background: #f2f3f5; color: #1f2a30; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: 32px; margin: 0 0 28px; letter-spacing: -.01em; line-height: 1.2; }
  fieldset { margin: 0 0 24px; padding: 0; border: 0; }
  legend { margin-bottom: 10px; padding: 0; font-weight: 700; }
  label { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; padding: 14px 16px; border-radius: 12px;
          background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; }
  label:has(:checked) { box-shadow: 0 0 0 2px #1e6563; }
  input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: #1e6563; }
  small { display: block; color: #57534a; font-size: 15px; }
  button { width: 100%; min-height: 56px; margin-top: 4px; border: 0; border-radius: 12px; background: #1e6563; color: #fff;
           font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #185250; }
  :focus-visible { outline: 3px solid #5e9c99; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>CSU34011 site · preview</h1>
  <form action="prototypes/final/" method="get">
    <fieldset>
      <legend>Layout</legend>
      <label><input type="radio" name="view" value="unified" checked>
        <span>One list<small>Every lecture in teaching order, extras right after their lecture</small></span></label>
      <label><input type="radio" name="view" value="split">
        <span>Split<small>Lectures first, then the extras under “Beyond the book”</small></span></label>
    </fieldset>
    <fieldset>
      <legend>Include</legend>
      <label><input type="checkbox" name="search" checked>
        <span>Search<small>Finds lectures and the exact slides</small></span></label>
      <label><input type="checkbox" name="checklist" checked>
        <span>Checklist<small>Students tick off lectures; kept in their own browser</small></span></label>
    </fieldset>
    <button type="submit">View website</button>
  </form>
</main>
</body>
</html>
